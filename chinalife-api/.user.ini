; ChinaLife API only: artists upload songs up to 100 MB (sent as the raw file and streamed to disk).
; PHP-FPM reads this per directory (it can take up to 5 minutes to apply). nginx also needs
; client_max_body_size 110m for hafrik.com.
post_max_size = 110M
upload_max_filesize = 110M
max_input_time = 600
max_execution_time = 600
